# Only the application's own container. The database (and Elasticsearch, if used) are external services
# reached through the environment variables below. Run it with:
#   docker compose -f docker-compose.yml up --build
# (the -f keeps the developer-only docker-compose.override.yml out of the merge).
services:
    openmrs-cont:
        image: openmrs-cont:${TAG:-latest}
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        environment:
            OMRS_DB: ${OMRS_DB:-mariadb}
            OMRS_DB_HOSTNAME: ${OMRS_DB_HOSTNAME:?set OMRS_DB_HOSTNAME}
            OMRS_DB_PORT: ${OMRS_DB_PORT:-3306}
            OMRS_DB_NAME: ${OMRS_DB_NAME:-openmrs}
            OMRS_DB_USERNAME: ${OMRS_DB_USERNAME:-openmrs}
            OMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:?set OMRS_DB_PASSWORD}
            OMRS_ADMIN_USER_PASSWORD: ${OMRS_ADMIN_USER_PASSWORD:?set OMRS_ADMIN_USER_PASSWORD}
            OMRS_ADMIN_PASSWORD_LOCKED: ${OMRS_ADMIN_PASSWORD_LOCKED:-true}
            OMRS_CREATE_TABLES: ${OMRS_CREATE_TABLES:-true}
            OMRS_AUTO_UPDATE_DATABASE: ${OMRS_AUTO_UPDATE_DATABASE:-true}
            OMRS_SEARCH: ${OMRS_SEARCH:-lucene}
            OMRS_SEARCH_ES_URIS: ${OMRS_SEARCH_ES_URIS:-http://elasticsearch:9200}
            OMRS_JAVA_MEMORY_OPTS: ${OMRS_JAVA_MEMORY_OPTS:--XX:NewSize=128m -Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
            TZ: UTC
        volumes:
            - openmrs-data:/openmrs/data

volumes:
    openmrs-data:
