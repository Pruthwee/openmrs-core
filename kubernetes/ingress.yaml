apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmrs-cont-ingress
  namespace: openmrs-cont
  labels:
    app: openmrs-cont
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /openmrs/health/alive
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - host: openmrs-cont.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openmrs-cont-service
                port:
                  number: 80
